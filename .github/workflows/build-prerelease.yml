name: Build Tweak Pre-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid ffmpeg

      - name: Install Theos
        run: |
          set -e
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          test -x "$HOME/theos/bin/dm.pl"

      - name: Install RootHide Theos
        run: |
          set -e
          git clone --depth=1 --recurse-submodules https://github.com/roothide/theos.git "$HOME/theos-roothide"
          test -x "$HOME/theos-roothide/bin/dm.pl"

      - name: Validate project
        run: |
          set -e
          test -s Makefile
          test -s Runtime.xm
          test -s MusorDropTrollTweak.plist
          test -s control
          test -s video.mp4
          test -s Prefs/Makefile
          test -s Prefs/MDRootListController.m
          test -s Prefs/Resources/Info.plist
          test -s Prefs/Resources/Root.plist
          test -s layout/preinst
          test -s layout/Library/PreferenceLoader/Preferences/com.fogboundsloth25.musordroptrolltweak.plist
          plutil -lint MusorDropTrollTweak.plist
          plutil -lint Prefs/Resources/Info.plist
          plutil -lint Prefs/Resources/Root.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/com.fogboundsloth25.musordroptrolltweak.plist
          grep -q 'com.apple.UIKit' MusorDropTrollTweak.plist
          grep -q 'PSButtonCell' Prefs/Resources/Root.plist
          grep -q 'applySettings' Prefs/Resources/Root.plist
          grep -q '<key>isController</key>' layout/Library/PreferenceLoader/Preferences/com.fogboundsloth25.musordroptrolltweak.plist
          grep -q 'NSPrincipalClass' Prefs/Resources/Info.plist
          grep -q 'MDRootListController' Prefs/Resources/Info.plist
          grep -q 'jbroot\|ROOT_PATH_NS' Runtime.xm

      - name: Build transparent HEVC video
        run: |
          set -euo pipefail
          mkdir -p "layout/Library/Application Support/MusorDropTrollTweak"
          intermediate="${RUNNER_TEMP}/video_prores4444.mov"
          output="layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"

          ffmpeg -hide_banner -loglevel error -y \
            -i video.mp4 \
            -vf "colorkey=0x00ff00:0.20:0.10,despill=green:0.70,format=yuva444p10le" \
            -c:v prores_ks -profile:v 4 -pix_fmt yuva444p12le \
            -c:a pcm_s16le \
            "$intermediate"

          ffprobe -v error -show_entries stream=index,codec_name,codec_tag_string,pix_fmt,width,height,duration -of default=nw=1 "$intermediate"
          for t in 1 3 5; do
            stats=$(ffmpeg -hide_banner -loglevel error -ss "$t" -i "$intermediate" -vf alphaextract -frames:v 1 -f rawvideo - | python3 -c 'import sys; b=sys.stdin.buffer.read(); a=list(b); print(min(a),max(a),sum(a)/len(a))')
            echo "prores alpha @ ${t}s = $stats"
            echo "$stats" | awk '{ if ($1 >= 250 || $2 <= 20 || $3 <= 1) exit 1 }'
          done

          avconvert \
            --source "$intermediate" \
            --output "$output" \
            --preset PresetHEVCHighestQualityWithAlpha \
            --replace \
            --verbose

          test -s "$output"
          ffprobe -v error -show_entries stream=index,codec_name,codec_tag_string,width,height,r_frame_rate,duration -of default=nw=1 "$output"
          mdls -name kMDItemCodecs -name kMDItemDuration "$output" || true
          final_codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$output")
          test "$final_codec" = "hevc"
          grep -qi 'alpha' < <(mdls -name kMDItemCodecs "$output")

      - name: Build rootful
        run: |
          set -e
          export THEOS="$HOME/theos"
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm/' control
          rm -rf packages build/packages
          mkdir -p build/packages
          make clean package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootful.deb
          git checkout -- control

      - name: Build rootless
        run: |
          set -e
          export THEOS="$HOME/theos"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=rootless
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootless.deb
          git checkout -- control

      - name: Build RootHide
        run: |
          set -e
          export THEOS="$HOME/theos-roothide"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=roothide
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-roothide.deb
          git checkout -- control

      - name: Verify packages
        run: |
          set -e
          files=(build/packages/*.deb)
          test "${#files[@]}" -eq 3
          for pkg in "${files[@]}"; do
            echo "=== $(basename "$pkg") ==="
            ls -lh "$pkg"
            ar -t "$pkg" | grep -q '^debian-binary$'
            ar -t "$pkg" | grep -q '^control.tar'
            ar -t "$pkg" | grep -q '^data.tar'

            tmp=$(mktemp -d)
            cd "$tmp"
            ar -x "$GITHUB_WORKSPACE/$pkg"
            control_tar=$(find . -name 'control.tar.*' -print -quit)
            data_tar=$(find . -name 'data.tar.*' -print -quit)
            tar -tf "$control_tar" > control.list
            tar -tf "$data_tar" > data.list
            grep -Eq '(^|/)postinst$' control.list || true
            grep -Eq '(^|/)preinst$' data.list
            grep -Eq 'Library/PreferenceLoader/Preferences/com\.fogboundsloth25\.musordroptrolltweak\.plist$' data.list
            grep -Eq 'Library/PreferenceBundles/MusorDropTrollTweakPrefs\.bundle/Info\.plist$' data.list
            grep -Eq 'Library/PreferenceBundles/MusorDropTrollTrollTweakPrefs\.bundle/' data.list || grep -Eq 'Library/PreferenceBundles/MusorDropTrollTweakPrefs\.bundle/' data.list
            grep -Eq 'Library/PreferenceBundles/MusorDropTrollTweakPrefs\.bundle/MDRootListController' data.list
            grep -Eq 'Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak\.dylib$' data.list
            grep -Eq 'Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak\.plist$' data.list
            grep -Eq 'Library/Application Support/MusorDropTrollTweak/video_alpha\.mov$' data.list
            rm -rf "$tmp"
            cd "$GITHUB_WORKSPACE"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: MusorDropTrollTweak-build-${{ github.run_number }}
          path: build/packages/*.deb
          if-no-files-found: error

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release create "nightly-${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --title "MusorDropTrollTweak nightly ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build: Apple HEVC with Alpha video, RGB green-screen removal, AVPlayer/AVPlayerLayer playback, smooth background dimming, audio session support, Apply button for settings, lock-aware repeating countdown, rootful/rootless/RootHide packages." \
            build/packages/*.deb
