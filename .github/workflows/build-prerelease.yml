name: Build Tweak Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install ldid dpkg ffmpeg

      - name: Install Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Prepare default video with green screen removed
        run: |
          set -euo pipefail
          test -f video.mp4
          mkdir -p Resources
          ffmpeg -hide_banner -loglevel error -y \
            -i video.mp4 \
            -vf "chromakey=0x00ff00:0.20:0.10,format=yuva444p10le" \
            -c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le \
            -an Resources/video_alpha.mov
          test -s Resources/video_alpha.mov

      - name: Build tweak packages
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1 STRIP=1

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p build/packages
          find . -type f \( -name '*.deb' -o -name '*.pkg' -o -name '*.tipa' \) \
            -not -path './build/*' -exec cp -v {} build/packages/ \;
          test -n "$(find build/packages -type f -print -quit)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusorDropTrollTweak-build-${{ github.run_number }}
          path: build/packages/*
          if-no-files-found: error

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-${GITHUB_RUN_NUMBER}"
          TITLE="MusorDropTrollTweak nightly ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --prerelease \
            --title "$TITLE" \
            --notes "Automatic pre-release build from commit ${GITHUB_SHA}." \
            build/packages/*
