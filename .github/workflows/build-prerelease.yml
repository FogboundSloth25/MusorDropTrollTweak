name: Build Tweak Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ldid ffmpeg

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          test -x "$HOME/theos/bin/dm.pl"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Validate source layout
        run: |
          set -euo pipefail
          test -s Makefile
          test -s Tweak.xm
          test -s MusorDropTrollTweak.plist
          test -s control
          test -s video.mp4
          test -s layout/preinst
          test ! -e Prefs/MDRootListController.m
          test ! -e Prefs/Resources/Root.plist
          test ! -e Prefs/Resources/Info.plist

          plutil -lint MusorDropTrollTweak.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/com.fogboundsloth25.musordroptrolltweak.plist
          grep -q '<key>Filter</key>' MusorDropTrollTweak.plist
          grep -q '<key>Bundles</key>' MusorDropTrollTweak.plist
          grep -q 'com.apple.UIKit' MusorDropTrollTweak.plist

          pref_dir="layout/Library/PreferenceLoader/Preferences"
          pref_count=$(find "$pref_dir" -maxdepth 1 -type f -name '*.plist' | wc -l | tr -d ' ')
          test "$pref_count" -eq 1
          grep -q '<key>title</key>' "$pref_dir"/*.plist
          grep -q '<key>entry</key>' "$pref_dir"/*.plist
          grep -q '<key>items</key>' "$pref_dir"/*.plist
          grep -q 'PSSwitchCell' "$pref_dir"/*.plist
          grep -q 'PSSliderCell' "$pref_dir"/*.plist
          grep -q 'PSEditTextCell' "$pref_dir"/*.plist
          grep -q '<string>Задержка показа</string>' "$pref_dir"/*.plist
          grep -q '<string>Громкость</string>' "$pref_dir"/*.plist
          grep -q '<string>Кастомное видео</string>' "$pref_dir"/*.plist

      - name: Prepare default transparent video
        run: |
          set -euo pipefail
          test -s video.mp4
          rm -rf "layout/Library/Application Support/MusorDropTrollTweak"
          mkdir -p "layout/Library/Application Support/MusorDropTrollTweak"

          # Apple documents HEVC with Alpha as an AVPlayer/AVPlayerLayer delivery
          # format. On macOS runners use VideoToolbox instead of libx265.
          if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'hevc_videotoolbox'; then
            ffmpeg -hide_banner -loglevel error -y \
              -i video.mp4 \
              -vf "chromakey=0x00ff00:0.20:0.10,format=yuva420p" \
              -c:v hevc_videotoolbox -alpha_quality 0.90 -tag:v hvc1 \
              -c:a aac -b:a 192k \
              "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          else
            echo "VideoToolbox HEVC encoder unavailable; using ProRes 4444 fallback."
            ffmpeg -hide_banner -loglevel error -y \
              -i video.mp4 \
              -vf "chromakey=0x00ff00:0.20:0.10,format=yuva444p10le" \
              -c:v prores_ks -profile:v 4 -pix_fmt yuva444p12le \
              -c:a pcm_s16le \
              "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          fi

          test -s "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          ffprobe -v error -show_entries stream=index,codec_name,codec_tag_string,pix_fmt,width,height,r_frame_rate -of default=nw=1 "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          video_probe=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,codec_tag_string -of default=nw=1:nk=1 "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov")
          echo "$video_probe"
          if echo "$video_probe" | grep -q '^hevc$'; then
            echo "$video_probe" | grep -q 'hvc1'
            echo "$video_probe" | grep -q 'yuva420p'
          else
            echo "$video_probe" | grep -q '^prores$'
            echo "$video_probe" | grep -Eq '^yuva444p([0-9]+)?le$'
          fi

      - name: Build rootful package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm/' control
          rm -rf packages build/packages
          rm -f control.bak
          mkdir -p build/packages
          make clean package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootful.deb
          git checkout -- control
          rm -f control.bak

      - name: Build rootless package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          rm -f control.bak
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=rootless
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootless.deb
          git checkout -- control
          rm -f control.bak

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/roothide/theos.git "$HOME/theos-roothide"
          test -x "$HOME/theos-roothide/bin/dm.pl"

      - name: Build roothide package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos-roothide"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
          rm -f control.bak
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=roothide
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-roothide.deb
          git checkout -- control
          rm -f control.bak

      - name: Verify packages
        run: |
          set -euo pipefail
          packages=(build/packages/*.deb)
          test "${#packages[@]}" -eq 3

          for pkg in "${packages[@]}"; do
            echo "=== $(basename "$pkg") ==="
            ls -lh "$pkg"
            test -s "$pkg"
            ar -t "$pkg" | grep -q '^debian-binary$'
            ar -t "$pkg" | grep -q '^control.tar'
            ar -t "$pkg" | grep -q '^data.tar'

            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            (
              cd "$tmp"
              ar -x "$GITHUB_WORKSPACE/$pkg"
            )

            data_tar=$(find "$tmp" -maxdepth 1 -type f -name 'data.tar.*' -print -quit)
            control_tar=$(find "$tmp" -maxdepth 1 -type f -name 'control.tar.*' -print -quit)
            test -s "$data_tar"
            test -s "$control_tar"
            tar -tf "$data_tar" > "$tmp/data.list"
            tar -tf "$control_tar" > "$tmp/control.list"

            root_prefix=""
            if grep -Eq '^var/jb/' "$tmp/data.list"; then root_prefix='var/jb/'; fi

            pref_entries=$(grep -Ec '(^|/)(var/jb/)?Library/PreferenceLoader/Preferences/[^/]+\.plist$' "$tmp/data.list" || true)
            test "$pref_entries" -eq 1
            grep -Eq '(^|/)(var/jb/)?Library/PreferenceLoader/Preferences/com\.fogboundsloth25\.musordroptrolltweak\.plist$' "$tmp/data.list"
            grep -Eq '(^|/)(var/jb/)?Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak\.dylib$' "$tmp/data.list"
            grep -Eq '(^|/)(var/jb/)?Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak\.plist$' "$tmp/data.list"
            grep -Eq '(^|/)(var/jb/)?Library/Application Support/MusorDropTrollTweak/video_alpha\.mov$' "$tmp/data.list"
            grep -Eq '(^|/)(var/jb/)?preinst$' "$tmp/data.list"

            ! grep -Eq '(^|/)(var/jb/)?Library/PreferenceBundles/MusorDropTrollTweakPrefs\.bundle(/|$)' "$tmp/data.list"
            ! grep -Eq '(^|/)(var/jb/)?Library/PreferenceLoader/Preferences/MusorDropTrollTweakPrefs\.plist$' "$tmp/data.list"
            ! grep -Eq '(^|/)(var/jb/)?Library/Application Support/MusorDropTrollTweak/video_prores4444\.mov$' "$tmp/data.list"

            data_dir=$(mktemp -d)
            tar -xf "$data_tar" -C "$data_dir"
            pref_file="$data_dir/${root_prefix}Library/PreferenceLoader/Preferences/com.fogboundsloth25.musordroptrolltweak.plist"
            tweak_filter="$data_dir/${root_prefix}Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak.plist"
            test -s "$pref_file"
            test -s "$tweak_filter"
            plutil -lint "$pref_file"
            plutil -lint "$tweak_filter"
            pref_dump=$(plutil -p "$pref_file")
            printf '%s\n' "$pref_dump" | grep -q 'PSSwitchCell'
            printf '%s\n' "$pref_dump" | grep -q 'PSSliderCell'
            printf '%s\n' "$pref_dump" | grep -q 'PSEditTextCell'
            filter_dump=$(plutil -p "$tweak_filter")
            printf '%s\n' "$filter_dump" | grep -q 'com.apple.UIKit'
            rm -rf "$data_dir" "$tmp"
            trap - EXIT
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusorDropTrollTweak-build-${{ github.run_number }}
          path: build/packages/*.deb
          if-no-files-found: error

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-${GITHUB_RUN_NUMBER}"
          TITLE="MusorDropTrollTweak nightly ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --prerelease \
            --title "$TITLE" \
            --notes "1.2.0. Reworked runtime scheduling, cross-process preference reload, repeat countdown, 25% dimming, full-screen aspect-fill video, clearer settings, and HEVC with Alpha delivery when VideoToolbox is available. Rootful, rootless and RootHide packages." \
            build/packages/*.deb
