name: Build Tweak Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ldid ffmpeg

      - name: Install Theos with submodules
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          test -x "$HOME/theos/bin/dm.pl"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Validate project metadata
        run: |
          set -euo pipefail
          test -s Makefile
          test -s Tweak.xm
          test -s MusorDropTrollTweak.plist
          test -s Prefs/Resources/Info.plist
          test -s Prefs/Resources/Root.plist
          test -s Prefs/MDRootListController.m
          test -s control
          test -s video.mp4
          test -s layout/preinst

          plutil -lint MusorDropTrollTweak.plist
          plutil -lint Prefs/Resources/Info.plist
          plutil -lint Prefs/Resources/Root.plist
          grep -q '<key>Filter</key>' MusorDropTrollTweak.plist
          ! grep -q '<key>Bundles</key>' MusorDropTrollTweak.plist
          ! grep -q '<key>Executables</key>' MusorDropTrollTweak.plist
          ! grep -q '<key>Classes</key>' MusorDropTrollTweak.plist

          pref_dir="layout/Library/PreferenceLoader/Preferences"
          pref_count=$(find "$pref_dir" -maxdepth 1 -type f -name '*.plist' | wc -l | tr -d ' ')
          test "$pref_count" -eq 1
          pref_file=$(find "$pref_dir" -maxdepth 1 -type f -name '*.plist' -print -quit)
          test -n "$pref_file"
          grep -q '<key>entry</key>' "$pref_file"
          grep -q '<string>MusorDropTrollTweakPrefs</string>' "$pref_file"
          grep -q '<string>MusorDropTrollTweak</string>' "$pref_file"
          plutil -lint "$pref_file"

      - name: Prepare default video with green screen removed
        run: |
          set -euo pipefail
          test -s video.mp4
          rm -rf "layout/Library/Application Support/MusorDropTrollTweak"
          mkdir -p "layout/Library/Application Support/MusorDropTrollTweak"
          ffmpeg -hide_banner -loglevel error -y \
            -i video.mp4 \
            -vf "chromakey=0x00ff00:0.20:0.10,format=yuva444p10le" \
            -c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le \
            -c:a aac -b:a 192k \
            "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          test -s "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          video_probe=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt -of default=nw=1:nk=1 "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov")
          echo "$video_probe"
          echo "$video_probe" | grep -q '^prores$'
          echo "$video_probe" | grep -Eq '^yuva444p([0-9]+)?le$'

      - name: Build rootful package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm/' control
          rm -rf packages build/packages
          rm -f control.bak
          mkdir -p build/packages
          make clean package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootful.deb
          git checkout -- control
          rm -f control.bak

      - name: Build rootless package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          rm -f control.bak
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=rootless
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootless.deb
          git checkout -- control
          rm -f control.bak

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/roothide/theos.git "$HOME/theos-roothide"
          test -x "$HOME/theos-roothide/bin/dm.pl"

      - name: Build roothide package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos-roothide"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
          rm -f control.bak
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=roothide
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-roothide.deb
          git checkout -- control
          rm -f control.bak

      - name: Verify package outputs and contents
        run: |
          set -euo pipefail
          packages=(build/packages/*.deb)
          test "${#packages[@]}" -eq 3

          for pkg in "${packages[@]}"; do
            test -s "$pkg"
            ar -t "$pkg" | grep -q '^debian-binary$'
            ar -t "$pkg" | grep -q '^control.tar'
            ar -t "$pkg" | grep -q '^data.tar'

            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            (
              cd "$tmp"
              ar -x "$GITHUB_WORKSPACE/$pkg"
            )

            data_tar=$(find "$tmp" -maxdepth 1 -type f -name 'data.tar.*' -print -quit)
            control_tar=$(find "$tmp" -maxdepth 1 -type f -name 'control.tar.*' -print -quit)
            test -s "$data_tar"
            test -s "$control_tar"

            tar -tf "$data_tar" > "$tmp/data.list"
            tar -tf "$control_tar" > "$tmp/control.list"

            echo "=== DATA: $pkg ==="
            cat "$tmp/data.list"
            echo "=== CONTROL: $pkg ==="
            cat "$tmp/control.list"

            pref_entries=$(grep -Ec '(^|/)Library/PreferenceLoader/Preferences/[^/]+\.plist$' "$tmp/data.list" || true)
            test "$pref_entries" -eq 1
            grep -Eq '(^|/)Library/PreferenceLoader/Preferences/com\.fogboundsloth25\.musordroptrolltweak\.plist$' "$tmp/data.list"
            grep -Eq '(^|/)Library/PreferenceBundles/MusorDropTrollTweakPrefs\.bundle(/|$)' "$tmp/data.list"
            grep -Eq '(^|/)MusorDropTrollTweak\.dylib$' "$tmp/data.list"
            grep -Eq '(^|/)video_alpha\.mov$' "$tmp/data.list"
            grep -Eq '(^|/)preinst$' "$tmp/data.list"
            grep -Eq '(^|/)MusorDropTrollTweak\.plist$' "$tmp/data.list"
            ! grep -Eq '(^|/)video_prores4444\.mov$' "$tmp/data.list"
            ! grep -Eq '(^|/)MusorDropTrollTweakPrefs\.plist$' "$tmp/data.list"

            data_dir=$(mktemp -d)
            tar -xf "$data_tar" -C "$data_dir"
            test -s "$data_dir/Library/PreferenceLoader/Preferences/com.fogboundsloth25.musordroptrolltweak.plist"
            test -s "$data_dir/Library/PreferenceBundles/MusorDropTrollTweakPrefs.bundle/Root.plist"
            test -s "$data_dir/Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak.dylib"
            test -s "$data_dir/Library/MobileSubstrate/DynamicLibraries/MusorDropTrollTweak.plist"
            test -s "$data_dir/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
            rm -rf "$data_dir" "$tmp"
            trap - EXIT
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusorDropTrollTweak-build-${{ github.run_number }}
          path: build/packages/*.deb
          if-no-files-found: error

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-${GITHUB_RUN_NUMBER}"
          TITLE="MusorDropTrollTweak nightly ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --prerelease \
            --title "$TITLE" \
            --notes "Automatic build from commit ${GITHUB_SHA}. Includes rootful, rootless and RootHide packages. CI verifies one unrestricted injection filter, exactly one PreferenceLoader entry, upgrade cleanup, runtime dylib, preference bundle, and valid ProRes 4444 alpha video." \
            build/packages/*.deb
