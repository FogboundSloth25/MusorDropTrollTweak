name: Build Tweak Pre-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ldid ffmpeg

      - name: Install Theos with submodules
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$HOME/theos"
          test -x "$HOME/theos/bin/dm.pl"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Prepare default video with green screen removed
        run: |
          set -euo pipefail
          test -s video.mp4
          mkdir -p "layout/Library/Application Support/MusorDropTrollTweak"
          ffmpeg -hide_banner -loglevel error -y \
            -i video.mp4 \
            -vf "chromakey=0x00ff00:0.20:0.10,format=yuva444p10le" \
            -c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le \
            -c:a aac -b:a 192k \
            "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"
          test -s "layout/Library/Application Support/MusorDropTrollTweak/video_alpha.mov"

      - name: Build rootful package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm/' control
          rm -rf packages build/packages
          rm -f control.bak
          mkdir -p build/packages
          make clean package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootful.deb
          git checkout -- control
          rm -f control.bak

      - name: Build rootless package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64/' control
          rm -f control.bak
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=rootless
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-rootless.deb
          git checkout -- control
          rm -f control.bak

      - name: Install RootHide Theos
        run: |
          set -euo pipefail
          git clone --depth=1 --recurse-submodules https://github.com/roothide/theos.git "$HOME/theos-roothide"
          test -x "$HOME/theos-roothide/bin/dm.pl"

      - name: Build roothide package
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos-roothide"
          make clean
          sed -i.bak 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
          rm -f control.bak
          rm -rf packages
          make package FINALPACKAGE=1 STRIP=1 THEOS_PACKAGE_SCHEME=roothide
          pkg=$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$pkg"
          cp "$pkg" build/packages/MusorDropTrollTweak-roothide.deb
          git checkout -- control
          rm -f control.bak

      - name: Verify package outputs
        run: |
          set -euo pipefail
          ls -lh build/packages/*.deb
          test "$(find build/packages -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" -eq 3
          for pkg in build/packages/*.deb; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusorDropTrollTweak-build-${{ github.run_number }}
          path: build/packages/*.deb
          if-no-files-found: error

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nightly-${GITHUB_RUN_NUMBER}"
          TITLE="MusorDropTrollTweak nightly ${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --prerelease \
            --title "$TITLE" \
            --notes "Automatic build from commit ${GITHUB_SHA}. Includes rootful, rootless and RootHide packages. The bundled default video is chroma-keyed to remove the green screen while preserving audio." \
            build/packages/*.deb
